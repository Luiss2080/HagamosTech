name: ✨ Solicitud de funcionalidad
description: Proponé una mejora o una nueva idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
      placeholder: "Siempre me frustra cuando..."
    validations:
      required: true
  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
