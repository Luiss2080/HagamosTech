name: 🐛 Reporte de bug
description: Algo no funciona como debería
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Gracias por tomarte el tiempo de reportar el problema.
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describí el problema y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o logs
      render: shell
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Navegador, sistema operativo, versión de Node"
